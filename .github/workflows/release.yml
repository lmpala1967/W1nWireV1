name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v2.0.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building release ${version}"

  desktop:
    name: Windows desktop application
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Generate the Windows resources
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd cmd/w1nwire-desktop
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --out rsrc \
            --manifest gui --icon ../../packaging/icon/w1nwire.ico \
            --product-version "${VERSION#v}" --file-version "${VERSION#v}" \
            --file-description "W1nWire VPN client" --product-name "W1nWire" \
            --original-filename w1nwire-desktop.exe --copyright "MIT License"

      - name: Build the executable
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" \
            -o dist/w1nwire-desktop.exe ./cmd/w1nwire-desktop
          cd dist
          zip -9 "W1nWire-${VERSION}-windows-x64.zip" w1nwire-desktop.exe
          sha256sum ./* > SHA256SUMS.txt

      - name: Upload the desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-desktop
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  server:
    name: Server build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 is mandatory: the production Oracle Cloud instance is an
          # Ampere (aarch64) VM, so linux/arm64 is a first-class target.
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build the binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          out="dist/${GOOS}-${GOARCH}"
          mkdir -p "$out"
          ldflags="-s -w -X main.version=${VERSION}"
          # The asset names carry the platform: the installer downloads
          # w1nwire-server-linux-amd64 or -arm64, and a merged artifact set
          # must not contain two files with the same name.
          go build -trimpath -buildvcs=false -ldflags "$ldflags" \
            -o "${out}/w1nwire-server-${GOOS}-${GOARCH}" ./cmd/w1nwire-server
          go build -trimpath -buildvcs=false -ldflags "$ldflags" \
            -o "${out}/w1nwire-client-${GOOS}-${GOARCH}" ./cmd/w1nwire-client
          cp deploy/install.sh "${out}/install.sh"
          chmod +x "${out}/install.sh"
          cd "$out"
          sha256sum ./* > SHA256SUMS.txt

      - name: Upload the server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}-${{ matrix.goarch }}/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the GitHub release
    needs:
      - version
      - desktop
      - server
    runs-on: ubuntu-latest
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate the combined checksums
        run: |
          set -euo pipefail
          cd artifacts
          find . -mindepth 2 -name "SHA256SUMS.txt" -delete
          rm -f ./SHA256SUMS.txt
          find . -mindepth 1 -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: W1nWire ${{ needs.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/w1nwire-desktop.exe
            artifacts/W1nWire-*-windows-x64.zip
            artifacts/w1nwire-server-linux-*
            artifacts/w1nwire-client-linux-*
            artifacts/install.sh
